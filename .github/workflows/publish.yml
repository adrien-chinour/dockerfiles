name: Create and publish Docker images

on:
    workflow_dispatch:
    push:
        branches: [ 'main' ]
        paths:
            - Dockerfile
            - .github/workflows/publish.yml

env:
    REGISTRY: ghcr.io

jobs:
    build-and-push-image:
        strategy:
            fail-fast: false
            matrix:
                stage: [ 'php-cli-xdebug', 'php-cli-allinclusive', 'phpstan' ]
                target:
                    # PHP 7.4 official images only exist on Alpine and Debian 11 (bullseye)
                    - { version: '7.4', os: 'alpine' }
                    - { version: '7.4', os: 'bullseye' }
                    - { version: '8.4', os: 'alpine' }
                    - { version: '8.4', os: 'trixie' }
                    - { version: '8.5', os: 'alpine' }
                    - { version: '8.5', os: 'trixie' }
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Log in to the Container registry
                uses: docker/login-action@v4
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Get current build date
                id: date
                run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

            -   name: Build and push Docker image
                uses: docker/build-push-action@v7
                with:
                    context: .
                    build-args: |
                        VERSION=${{ matrix.target.version }}
                        BUILD_DATE=${{ steps.date.outputs.date }}
                        OS=${{ matrix.target.os }}
                    target: ${{ matrix.stage }}
                    tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.stage }}:${{ matrix.target.version }}-${{ matrix.target.os }}
                    push: true
