name: Create and publish Docker images

on:
    workflow_dispatch:
    schedule:
        # Daily rebuild to pick up base image and package security updates (04:30 UTC)
        - cron: '30 4 * * *'
    push:
        branches: [ 'main' ]
        paths:
            - Dockerfile
            - .github/workflows/publish.yml
    pull_request:
        paths:
            - Dockerfile
            - .github/workflows/publish.yml

# No default permissions: each job declares exactly what it needs
permissions: {}

concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

env:
    # Fallback mirror to avoid ghcr.io rate limits when downloading the vulnerability database
    TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2

jobs:
    lint:
        name: Lint Dockerfile and workflows
        # Scheduled rebuilds only pick up upstream updates: unchanged sources are not linted again
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            security-events: write # zizmor uploads its findings to code scanning
        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Lint Dockerfile (hadolint)
                uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
                with:
                    dockerfile: Dockerfile
                    failure-threshold: warning
                    # DL3008: apt packages are intentionally unpinned, images are rebuilt daily
                    # DL3022: COPY --from external images (composer, php-extension-installer)
                    ignore: DL3008,DL3022

            -   name: Lint workflows (actionlint)
                if: ${{ !cancelled() }}
                # Digest-pinned: not tracked by Dependabot, bump the tag and digest together
                run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

            -   name: Audit workflows security (zizmor)
                if: ${{ !cancelled() }}
                uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
                with:
                    # The pull_request token is read-only (Dependabot): code scanning upload would fail
                    advanced-security: ${{ github.event_name != 'pull_request' }}

    build:
        name: Build, scan and publish
        needs: lint
        # Run when lint passed or was skipped (scheduled rebuild), never when it failed
        if: ${{ !cancelled() && needs.lint.result != 'failure' }}
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
            security-events: write # Trivy uploads its findings to code scanning
        strategy:
            fail-fast: false
            matrix:
                stage: [ 'php-cli-xdebug', 'php-cli-allinclusive', 'phpstan' ]
                target:
                    # PHP 7.4 official images only exist on Debian 11 (bullseye)
                    - { version: '7.4', os: 'bullseye' }
                    - { version: '8.4', os: 'trixie' }
                    - { version: '8.5', os: 'trixie' }
        env:
            IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.stage }}:${{ matrix.target.version }}-${{ matrix.target.os }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Log in to the Container registry
                if: github.event_name != 'pull_request'
                uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Get current build date
                id: date
                run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

            -   name: Build Docker image
                uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
                with:
                    context: .
                    pull: true # always fetch the latest base image
                    load: true # keep the image local until it passes the vulnerability scan
                    push: false
                    build-args: |
                        VERSION=${{ matrix.target.version }}
                        BUILD_DATE=${{ steps.date.outputs.date }}
                        OS=${{ matrix.target.os }}
                    target: ${{ matrix.stage }}
                    tags: ${{ env.IMAGE }}

            -   name: Scan image for vulnerabilities (Trivy, report)
                uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
                with:
                    image-ref: ${{ env.IMAGE }}
                    format: sarif
                    output: trivy.sarif
                    exit-code: '0'

            -   name: Upload scan results to GitHub code scanning
                # The pull_request token is read-only (Dependabot): code scanning upload would fail
                if: github.event_name != 'pull_request'
                uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
                with:
                    sarif_file: trivy.sarif
                    category: trivy-${{ matrix.stage }}-${{ matrix.target.version }}-${{ matrix.target.os }}

            -   name: Scan image for vulnerabilities (Trivy, gate)
                uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
                with:
                    image-ref: ${{ env.IMAGE }}
                    format: table
                    severity: CRITICAL,HIGH
                    ignore-unfixed: true # a vulnerability without an upstream fix cannot block the build
                    exit-code: '1'
                    skip-setup-trivy: true

            -   name: Push Docker image
                if: github.event_name != 'pull_request'
                run: docker push "$IMAGE"
